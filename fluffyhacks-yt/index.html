<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluffy Hacks — YouTube Channel</title>
<style>
  body { font-family: sans-serif; text-align: center; padding: 48px 20px; background:#0f0f0f; color:#fff; }
  a.btn { display:inline-block; margin-top:18px; background:#ff0000; color:#fff; padding:14px 28px;
          border-radius:28px; text-decoration:none; font-size:18px; font-weight:bold; }
</style>
<script>
  var web = "https://www.youtube.com/@Fluffyhacksai?sub_confirmation=1";
  var ua = navigator.userAgent || "";
  function go() {
    if (/Android/i.test(ua)) {
      window.location =
        "intent://www.youtube.com/@Fluffyhacksai?sub_confirmation=1" +
        "#Intent;scheme=https;package=com.google.android.youtube;" +
        "S.browser_fallback_url=" + encodeURIComponent(web) + ";end";
    } else if (/iPhone|iPad|iPod/i.test(ua)) {
      window.location = "youtube://www.youtube.com/@Fluffyhacksai";
      setTimeout(function () { window.location = web; }, 1500);
    } else {
      window.location = web;
    }
  }
  window.onload = go;
</script>
</head>
<body>
  <h2>Fluffy Hacks</h2>
  <p>YouTube channel khul raha hai…</p>
  <a class="btn" href="https://www.youtube.com/@Fluffyhacksai?sub_confirmation=1">▶ Channel Kholo</a>
</body>
</html>
